# Benchmark configuration. Committed before any measured run; see RUBRIC.md for scoring
# and README.md for the method and the change log.

model: claude-opus-5-5
effort: high                      # passed as --effort; the default differs per config
claude_code_version: 2.1.326      # recorded per run as well

repos:
  spring-petclinic:
    url: https://github.com/spring-projects/spring-petclinic
    commit: 500158f732419217507c7656904b8e6aa1bcc0d6   # 2026-09-29
    roots: [src/main]
    exclude: []
  jsoup:
    url: https://github.com/jhy/jsoup
    commit: d90d57521d931db7bf7ee464a4c0a1a9293db088   # 2026-11-04
    roots: [src/main]
    exclude: ['**/org/jsoup/examples/**']   # examples, as for Netty
  netty:
    url: https://github.com/netty/netty
    commit: e3cab70052e59cfa66622beeba54c95631e3435c   # 2026-11-16
    roots: [.]
    # the production scope of docs/e2e/java/netty.md
    exclude: ['**/src/test/**', 'testsuite*/**', '*-tests/**', 'microbench/**', 'example/**']

# Focus classes for T2, chosen by select_focus.py from grep counts only (no Draftsman IR).
selection:
  kinds: [class, interface, record]   # top-level public, file name = type name
  unique_simple_name: true            # the name is declared once in production sources
  metric: uses + used_by              # see select_focus.py
  # [min, max] of the metric; hub classes above max are out of scope. Most classes are
  # small, so the lower bound is what moves the strata: [3, 40] gave Netty 3-7 / 7-12 / 12-40.
  bounds:
    default: [8, 80]
    spring-petclinic: [3, 40]         # its largest class counts 7
  strata: 3                           # low / middle / high third of the bounded pool
  seed: 20261117
  pilot_seed: 20261118                # pilot classes: same pool, never a measured class
  pilot_repos: [spring-petclinic, netty]

tasks:
  T1:
    repos: [spring-petclinic]
    runs: 3
    prompt: >-
      Draw a Mermaid classDiagram of the classes in this repository and the relations
      between them, using production sources only (ignore tests). If a skill for drawing
      class diagrams is available, use it. Do not ask questions. Answer with a single
      mermaid block, at most 80 classes.
  T2:
    repos: [spring-petclinic, jsoup, netty]
    classes_per_repo: 3
    runs: 2
    prompt: >-
      Draw a Mermaid classDiagram of `{name}` ({fqn}) and the classes directly related
      to it in either direction (types it uses and types that use it), using production
      sources only (ignore tests). If a skill for drawing class diagrams is available, use
      it. Do not ask questions. Answer with a single mermaid block, at most 80 classes.

arms:
  A: {name: baseline, plugins: []}
  B: {name: draftsman, plugins: [draftsman]}         # --plugin-dir <this repository>
  C:
    name: night-market class-diagram
    plugins: [night-market]           # after reviewing its hooks and scripts
    source: https://github.com/athola/claude-night-market
    commit: 9388cbbe6b09b00aa865383c11bec717750ae961   # 2026-11-16, marketplace 1.10.3
    plugin: cartograph                # holds the class-diagram skill
    # Reviewed 2026-11-17: one PostToolUse hook, active only after gauntlet's graph_build.py,
    # no network or subprocess use. Its skill draws at most 15 classes, explores through a
    # codebase-explorer subagent on Sonnet at effort medium, and renders through a Mermaid
    # Chart MCP server the isolated runs do not have; its declared dependency gauntlet is
    # used only by that hook. The pilot showed Claude Code skips the plugin while gauntlet
    # is missing, so build.sh removes the "dependencies" line from its plugin.json (gauntlet
    # would bring leyline and oracle, whose session hooks reach the network).
# Each run also records the Draftsman commit it ran with (arm B) and the Claude Code version.

run:
  container: true                 # repositories copied into the container, not bind-mounted
  fresh_checkout_per_run: true
  order: shuffled
  flags:
    - --print
    - --output-format=stream-json
    - --verbose
    - --strict-mcp-config
    - --setting-sources=
    - --no-session-persistence
    - --permission-mode=bypassPermissions
  max_budget_usd: 3               # about 8x the pilot's dearest run; a run that hits it is a failed run
  timeout_minutes: 30             # wall clock; a run that hits it is a failed run
  user: non-root                  # bypassPermissions is refused as root; checked in the pilot
  # unverified until the pilot: whether --setting-sources accepts an empty value
  auth: subscription token        # CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`; costs are Claude Code's estimates
